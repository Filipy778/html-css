<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HMTL5</title>
</head>
<body>
    <h1>Inserindo videos hospedados localmente</h1>
    <p>Este video esta hospedado no meu proprio servidor</p>
    <video width="500" controls poster="foto-p.png" autoplay loop>
          <source src="midia/meu_video.mp4" type="video/mp4">
          <source src="midia/meu-video-mkv.mkv" type="video/mp4">
          <source src="midia/meu-video-webm.webm" type="video/webm">
         <p>Seu navegador não tem compatiblidade com reprodução de video</p> 
                 <!--Colocar todos os tipos de formatos de video para ter maior compatiblidade e evitar erros em navegadores-->
    </video>
    <h1>Inserindo videos do Youtube</h1>
  <iframe width="560" height="315" src="https://www.youtube.com/embed/POYhbN2_Ynw?si=MY9bFisSgR5kHKdW" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
