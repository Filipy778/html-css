<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
     <style>
        @font-face {                                                               
            font-family: 'Pandora';
            src: url(fontes/Super\ Pandora.ttf) format('truetype');
            font-weight: normal;
            font-style: normal;
        }
      body{
         font-family: Arial, Helvetica, sans-serif;

      }
      h1{
        font-family: 'Pandora', Times, serif;
        font-size: 3em;
        font-weight: normal;
      }
       /*
               Tipos de format()
               -opentype (otf)
               -truetype (ttf)
               -enbedded-opentype
               -truetype-aat (Apple advanced typography)
               -svg
            
            */
     </style>

</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ipsa quis labore neque doloribus tempore id adipisci cupiditate nobis iusto, minus, sequi libero nulla! Adipisci error illo consectetur beatae id nisi.</p>
</body>
</html>
