<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
</head>
<style>
    iframe{
        width: 400;
        height: 400;
        border: 1px dashed black;
    }
</style>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>
        Acessando o site 
        
           <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" scrolling="no">
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Video</a>
           </iframe>

        para aprender a programar
    </p>
    <p>
        O repositorio do guanabara

        <iframe src="http://gustavoguanabara.github.io" frameborder="0" width="500" height="500">
            <a href="http://gustavoguanabara.github.io" target="_blank"> GitHub</a>
        </iframe>

        tambem é bem legal
    </p>
</body>
</html>
